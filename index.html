<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>한강 표류선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Song+Myung&display=swap">
<style>
/* Layout: 수치 바 / [장면 | 선택 패널] 한 화면. 좁으면 세로로 쌓는다. 단일 다크 테마(해 질 녘 한강). */
:root{
  --void:#0a0b1f; --panel:#141537; --panel-2:#1c1e4a; --line:#2f3175; --line-2:#474a9a;
  --ink:#efe9f6; --mute:#a9a3cb; --ember:#f2a65a; --rose:#d9708a;
  --cost:#f08a8a; --gain:#92dba6; --risk:#8fc0f4; --lock:#c5abf7;
  --f-title:'Song Myung','Nanum Myeongjo',serif;
  --f-display:'Do Hyeon','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#app{max-width:1500px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px}
/* HUD */
#hud{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;flex:none}
.day{display:flex;flex-direction:column;justify-content:center;padding:2px 10px 2px 2px}
.day b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;color:var(--ember)}
.day span{font-size:12px;color:var(--mute)}
.badge{display:flex;flex-direction:column;gap:1px;padding:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.badge .l{font-size:11px;color:var(--mute)}
.badge .v{font-family:var(--f-display);font-size:17px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge .v small{font-size:12px;color:var(--mute);font-family:var(--f-body)}
.good{color:var(--gain)} .warn{color:var(--ember)} .bad{color:var(--cost)} .info{color:var(--risk)}
.badge.flash{animation:flash .9s ease 1}
@keyframes flash{30%{border-color:var(--ember);background:#2a2350}}
.hud-btns{margin-left:auto;display:flex;gap:6px;align-items:stretch}
.hbtn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--mute)}
.hbtn:hover{border-color:var(--ember);color:var(--ink)}
/* Main */
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);gap:10px}
#stagewrap{min-height:0;min-width:0;container-type:size;display:flex;align-items:flex-start;justify-content:center}
#stage{position:relative;width:min(100cqw,177.78cqh);aspect-ratio:16/9;background:#05050f;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#cv{display:block;width:100%;height:100%;object-fit:contain}
#where{position:absolute;left:10px;top:10px;font-family:var(--f-display);font-size:15px;background:rgba(10,11,31,.72);padding:2px 10px;border-radius:4px}
#goal{position:absolute;right:10px;top:10px;font-size:12px;background:rgba(10,11,31,.78);padding:3px 10px;border-radius:4px;font-variant-numeric:tabular-nums}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow-y:auto}
@media (max-width:980px){
  #app{height:auto}
  #main{display:flex;flex-direction:column}
  #stagewrap{container-type:normal;display:block}
  #stage{width:100%}
  #panel{overflow:visible}
}
.ph{display:flex;justify-content:space-between;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.ph h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;text-wrap:balance}
.ph .sub{font-size:12px;color:var(--mute)}
.radio{font-size:13px;color:var(--mute);border-left:2px solid var(--line-2);padding-left:10px}
.txt p{margin:0 0 4px}
.tip{font-size:13px;background:#1a2a3a;border:1px solid #2e5470;border-radius:6px;padding:8px 10px;color:#cfe6f7}
.tip b{color:var(--risk);font-weight:400;font-family:var(--f-display);margin-right:6px}
.lines{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
.lines li{padding-left:16px;position:relative}
.lines li::before{content:"·";position:absolute;left:4px;color:var(--mute)}
.lines li.bad::before{content:"▼";font-size:9px;top:4px;color:var(--cost)}
.lines li.good::before{content:"▲";font-size:9px;top:4px;color:var(--gain)}
.lines li.near::before{content:"◆";font-size:9px;top:4px;color:var(--ember)}
.lines li.bad{color:#f5cccc} .lines li.good{color:#d2efda} .lines li.near{color:#f7dcb8}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:40px 1fr;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;cursor:pointer;width:100%}
.choice:hover:not(:disabled){border-color:var(--ember)}
.choice.sel{border-color:var(--ember);background:#272a5e}
.choice:disabled{cursor:not-allowed;opacity:.55}
.choice .k{display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;color:var(--ember);background:#17183f}
.choice .b{padding:8px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.choice .t{font-family:var(--f-display);font-size:17px;line-height:1.25}
.choice .d{font-size:13px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;padding:0 7px;border:1px solid currentColor;border-radius:999px;line-height:1.6;white-space:nowrap}
.t-cost{color:var(--cost)} .t-gain{color:var(--gain)} .t-risk{color:var(--risk)} .t-lock{color:var(--lock)} .t-mute{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ember);color:#1a1020;border:0;border-radius:6px;padding:8px 18px;font-family:var(--f-display);font-size:18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12px;color:var(--mute)}
.crew-list{display:flex;flex-direction:column;gap:6px}
.crew-row{display:flex;flex-direction:column;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.who{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.who b{font-family:var(--f-display);font-weight:400;font-size:16px}
.who span{font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{background:#121335;border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ember);color:#1a1020;border-color:var(--ember)}
.seg button:disabled{opacity:.3;cursor:not-allowed}
.mini{display:inline-flex;gap:4px;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.opt .n{font-family:var(--f-display);font-size:16px}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:30px;height:28px;background:#121335;border:1px solid var(--line);border-radius:5px;cursor:pointer}
.step b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,5,18,.78);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.box{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.box .x{align-self:flex-end}
.bar{height:6px;background:#0e0f2a;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gain)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--mute);font-weight:400}
.tblwrap{overflow-x:auto}
.end-name{font-family:var(--f-title);font-size:44px;line-height:1.05;color:var(--ink)}

.btn.ghost.danger{border-color:rgba(232,110,90,.55);color:#f0a090} .btn.ghost.danger:hover{background:rgba(232,110,90,.14)} .btn.danger:not(.ghost){background:#c4553f;color:#fff}
.confirm{border:1px solid rgba(232,110,90,.45);background:rgba(232,110,90,.08);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}

#act{position:absolute;z-index:30;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#act[hidden]{display:none}
#actbg,#actfx{position:absolute}
#actfx{image-rendering:pixelated;cursor:crosshair}
#actui{position:absolute;inset:0;pointer-events:none;font-family:var(--f-display);color:#efe7d8}
#actui button{pointer-events:auto}
#actui .atop{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#actui .atr{display:flex;gap:4px;align-items:center}
.apill{background:rgba(10,8,14,.62);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 9px;font-size:14px;line-height:1.25}
.apill.c{text-align:center} .apill b{font-weight:400;color:#fff} #actui .rd{color:#ff7a5a} #actui .em{color:#f2a65a} #actui .bl{color:#8dbdf2}
#actui kbd{display:inline-block;min-width:16px;padding:0 4px;border:1px solid rgba(255,255,255,.35);border-radius:4px;font-family:inherit;font-size:11px;text-align:center;background:rgba(255,255,255,.08)}
.apill.me{display:flex;gap:7px;align-items:center;padding:3px 9px 3px 3px}
.apill.me img{width:30px;height:30px;border-radius:50%;border:2px solid #f2a65a;image-rendering:pixelated}
.apill.me .nm{display:block;font-size:12px;font-weight:400;color:#cfc6dc}
.hpb{position:relative;display:block;width:130px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:3px;overflow:hidden}
.hpb i{position:absolute;left:0;top:0;bottom:0;display:block;transition:background .2s} .hpb .lag{background:#fff3d8;opacity:.75} .hpb .cur{background:#8fd8a2}
.aslots{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:5px;opacity:.9}
.aslot{position:relative;width:70px;height:40px;border-radius:7px;background:rgba(10,8,14,.55);border:1.5px solid rgba(255,255,255,.14);color:#efe7d8;font-family:inherit;display:flex;flex-direction:column;justify-content:center;padding:2px 6px;text-align:left;cursor:pointer;overflow:hidden}
.aslot.on{border-color:#f2a65a;background:rgba(40,24,14,.72)} .aslot.empty{opacity:.45}
.aslot i{position:absolute;right:5px;top:2px;font-style:normal;font-size:10px;color:#a79fb8} .aslot b{font-weight:400;font-size:13px;line-height:1.1} .aslot span{font-size:10px;color:#cfc6dc}
.aslot em{position:absolute;left:0;bottom:0;height:3px;background:#f2a65a;width:0}
.askip{font-family:inherit;font-size:11px;background:rgba(10,8,14,.5);border:1px solid rgba(255,255,255,.25);color:#cfc6dc;border-radius:6px;padding:3px 8px;cursor:pointer}
.ahint{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:max-content;max-width:min(560px,92%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;font-size:12px;background:rgba(10,8,14,.6);border-radius:8px;padding:5px 10px;opacity:0;transition:opacity .8s;pointer-events:none}
.ahint span{white-space:nowrap}
.ahint.show{opacity:1}
.atoast{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:linear-gradient(90deg,rgba(150,20,10,0),rgba(150,20,10,.8),rgba(150,20,10,0));padding:5px 60px;font-size:19px;white-space:nowrap}
.atoast.good{background:linear-gradient(90deg,rgba(30,110,60,0),rgba(30,110,60,.8),rgba(30,110,60,0))}
.abanner{position:absolute;left:0;right:0;top:32%;text-align:center;text-shadow:0 2px 12px #000;pointer-events:none}
.abanner b{display:block;font-weight:400;font-size:44px;color:#f2c08a;letter-spacing:.04em} .abanner small{font-size:16px;color:#e8dccb}
.abanner.in{animation:bannerIn 2.6s ease-out both}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.aend{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(12,10,16,.94);border:1px solid rgba(242,166,90,.5);border-radius:12px;padding:16px 22px;min-width:280px;text-align:center;pointer-events:auto;font-family:var(--f-body)}
.aend h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 8px;color:#f2a65a} .aend p{margin:2px 0;font-size:13px;color:#cfc6dc} .aend .btn{margin-top:12px}
.ast{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px} .ast span{background:rgba(255,255,255,.06);border-radius:8px;padding:5px 10px;min-width:58px} .ast small{display:block;font-size:11px;color:#a79fb8} .ast b{font-family:var(--f-display);font-weight:400;font-size:22px;color:#fff}
.apad{position:absolute;left:8px;bottom:8px;display:flex;gap:6px} .apad button{width:46px;height:46px;border-radius:50%;background:rgba(10,8,14,.5);border:1px solid rgba(255,255,255,.3);color:#efe7d8;font-size:17px}
body.acting #panel{pointer-events:none;opacity:.45} body.acting #roster,body.acting #where,body.acting #goal{visibility:hidden}
@media (max-width:700px),(max-height:500px){
  body.acting #roster{height:112px;overflow:hidden}
  .aslots{left:auto;right:4px;transform:none;bottom:4px;gap:3px} .aslot{width:48px;height:32px;padding:2px 4px} .aslot b{font-size:10px} .aslot span{font-size:9px} .aslot i{display:none}
  .apill{font-size:10px;padding:2px 5px;border-radius:6px} .apill.me img{width:22px;height:22px} .apill.me .nm{display:none} .hpb{width:70px;height:5px}
  #actui .atop{left:4px;right:4px;top:4px;gap:4px} #actui .atr .apill{display:none} .askip{font-size:10px;padding:2px 5px}
  .apad{bottom:4px;left:4px;gap:4px} .apad button{width:40px;height:40px;font-size:14px}
  #actui .ahint{bottom:44px;font-size:10px;padding:3px 6px;gap:2px 5px;max-width:70%} .atoast{font-size:13px;padding:3px 24px;top:16%} .abanner b{font-size:24px} .abanner small{font-size:11px}
  .aend{min-width:220px;padding:12px} .ast b{font-size:17px}
}
.amm{position:absolute;right:8px;top:44px;width:210px;border-radius:6px;border:1px solid rgba(255,255,255,.12);image-rendering:auto;pointer-events:none}
@media (max-width:700px),(max-height:500px){ .amm{width:140px;top:30px;right:4px} }
#chart{display:block;width:100%;height:auto;aspect-ratio:3/1;background:#121019;border-radius:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* portraits & roster */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;border:2px solid;flex:none;font-family:var(--f-display);font-size:13px;color:#140c10;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
#roster{position:absolute;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;flex-wrap:wrap;padding:20px 8px 6px;background:linear-gradient(0deg,rgba(4,4,8,.88),rgba(4,4,8,0))}
.rm{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:0 3px;min-width:44px}
.rm:hover .av{border-color:var(--ember)!important}
.rn{font-size:11px;line-height:1.2;color:var(--ink)} .rr{font-size:10px;color:var(--ember);line-height:1.2}
body.lobby #roster{display:none}
.who{align-items:center}
.spk{display:flex;gap:14px;flex-wrap:wrap}
.spk span.nm{display:flex;flex-direction:column;justify-content:center;font-family:var(--f-display);font-size:16px}
.spk .one{display:flex;gap:8px;align-items:center}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.slot{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot-h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sbtn{font-size:13px!important;padding:3px 10px!important;cursor:pointer;display:inline-block}
.ptxt{width:100%;min-height:80px;font-size:12px;background:#0e0f2a;color:var(--ink);border:1px solid var(--line);border-radius:4px}
.slot-g{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ember)}
/* Lobby */
body.lobby #hud, body.lobby #panel{display:none}
body.lobby #main{display:block}
body.lobby #stage{position:fixed;inset:0;width:auto;aspect-ratio:auto;border:0;border-radius:0;z-index:1}
body.lobby #cv{object-fit:cover}
body.lobby #where, body.lobby #goal{display:none}
#lobby{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;
  background:linear-gradient(90deg,rgba(8,8,26,.94) 0%,rgba(8,8,26,.82) 34%,rgba(8,8,26,.25) 62%,rgba(8,8,26,0) 80%);
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow-y:auto}
.lobby-in{max-width:560px;width:100%;padding:0 0 4vh 3vw;display:flex;flex-direction:column;gap:14px}
.kicker{margin:0;font-size:13px;letter-spacing:.18em;color:var(--ember)}
.ttl{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(56px,9vw,104px);line-height:.92;letter-spacing:-.01em;color:var(--ink);text-shadow:0 4px 30px rgba(0,0,0,.5)}
.ttl span{display:block;padding-left:.9em;color:#f6d7b0}
.lede{margin:0;color:#d6d0e8;max-width:30em}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.menu button{background:none;border:0;text-align:left;font-family:var(--f-display);font-size:24px;padding:4px 0 4px 0;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:10px}

.menu button small{font-family:var(--f-body);font-size:13px;color:var(--mute)}
.menu button:disabled{opacity:.35;cursor:default}
.ticker{margin:0;font-size:13px;color:var(--mute);min-height:1.6em}
.sheet{max-width:760px;width:100%;padding:0 0 3vh 3vw;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:44px;line-height:1}
.sheet h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ember)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}

const DEF_ROLE = {tae:'engine', du:'engine', so:'water', se:'water', ga:'land', min:'guard', myeong:'rest', ha:'rest', woo:'guard', nae:'land', yu:'rest', sea:'rest', rin:'rest', baby:'rest'};

/* ============================ META ============================ */
const META_KEY = 'hgp_meta_v1', SAVE_KEY = 'hgp_save_v1';

/* ============================ STATE ============================ */
let S = null, snaps = [];
let opts = {season:'monsoon', era:'early', diff:'normal', battle:'action'}, resetArm = false;

  return Object.assign({}, c, {alive:true, left:false, role:DEF_ROLE[c.id]||'rest', bitten:null, revealed:false, sick:false,
    quar:false, watch:false, away:false, xp:0, lv:1, tool:c.tool||null, medToday:false, pregnant:!!c.pregnant});
}

  S = {

    water:o.diff === 'survival' ? 24 : 30, fuel:30 + (META.driftBonus ? 5 : 0) + (o.season === 'cold' ? 6 : 0), food:70, parts:2, meds:3, hull:100, flare:1,

/* ============================ HELPERS ============================ */
const alive = () => S.crew.filter(c => c.alive && !c.left);
const onboard = () => alive().filter(c => !c.away);
const adults = () => alive().filter(c => !c.child);
const byId = id => S.crew.find(c => c.id === id);
const has = id => { const c = byId(id); return !!(c && c.alive && !c.left && !c.away); };
const avgTrust = () => { const a = alive(); return a.length ? Math.round(a.reduce((s,c)=>s+c.trust,0)/a.length) : 0; };
const bonded = () => avgTrust() >= 70;
const headcount = () => alive().length;
const waterDays = () => { const n = headcount(); return n ? S.water / n : 0; };
const wx = () => WX[S.wx] || WX.clear;
function consumption(){ let n = 0; alive().forEach(c => n += c.pregnant ? 1.5 : 1); if(S.rationing) n *= .8; return Math.round(n); }
function addTrust(n, o){ o = o||{}; alive().forEach(c => { if(o.except && o.except.includes(c.id)) return; c.trust = clamp(c.trust + n, 0, 100); }); }
function tr(id, n){ const c = byId(id); if(c && c.alive && !c.left) c.trust = clamp(c.trust + n, 0, 100); }
function addAp(n){ const v = Math.round(n * wx().mult); S.approach = Math.max(0, S.approach + v); return v; }
function hasTool(t){ return alive().some(c => c.tool === t && !c.away); }
function useTool(t){ const c = alive().find(c => c.tool === t); if(c) c.tool = null; return c; }
function giveTool(t, prefer){
  const pool = adults().filter(c => !c.away);
  let c = (prefer||[]).map(byId).find(x => x && x.alive && !x.left && !x.tool) || pool.find(x => !x.tool) || pool[0];
  if(c) c.tool = t; return c;
}
function join(id){ if(byId(id)) return byId(id); const c = mk(JOIN[id]); S.crew.push(c); return c; }
function relKey(a,b){ return [a,b].sort().join('|'); }
function rel(a,b){ return S.rel[relKey(a,b)] ?? 20; }
function addRel(a,b,n){ const k = relKey(a,b); S.rel[k] = clamp((S.rel[k] ?? 20) + n, 0, 100); }
function partnerOf(c){ let best = null, bv = 59; alive().forEach(o => { if(o.id===c.id) return; const v = rel(c.id,o.id); if(v > bv){ bv = v; best = o; } }); return best; }
function engineHas(id){ const c = byId(id); return !!(c && c.alive && !c.left && !c.away && c.role === 'engine'); }
function engineCount(){ return onboard().filter(c => c.role === 'engine' && !c.child && !c.quar).length; }
function legCost(i){ let c = LEGS[i]; if(engineHas('tae')) c -= 2; if(S.up.engine2) c -= 2; return Math.max(3, c); }
function fuelToGoal(){ let s = 0; for(let i = S.loc; i < 6; i++) s += legCost(i); return s; }
function canLand(c){ return !c.child && !c.pregnant && c.hp >= 70 && !c.quar && !c.away && c.alive && !c.left; }
function landers(){ return onboard().filter(c => c.role === 'land' && canLand(c)); }
function hurt(c, n, biteP){
  if(!c) return '';
  c.hp = clamp(c.hp - n, 0, 100);
  let s = `${c.name} 체력 -${n}`;
  if(biteP && c.hp > 0 && c.bitten === null && !c.baby && chance(biteP)){ bite(c); }
  return s;
}
function bite(c){ c.bitten = 0; c.revealed = c.trust >= 70 ? true : (c.trust >= 50 ? chance(.5) : false); }
function kill(c, L, why){
  if(!c || !c.alive) return;
  c.alive = false; c.hp = 0; c.quar = false; S.f.lastDeath = true; S.f.deaths++;
  addTrust(-5);
  const p = partnerOf(c);
  if(c.tool && c.tool !== 'memento'){ const t = c.tool; c.tool = null; const h = giveTool(t, p ? [p.id] : []); if(h && L) L.push(`${c.name}의 ${jo(TOOLS[t],'은','는')} ${h.name}에게 넘어갔다.`); }
  const h2 = p && !p.tool ? p : adults().find(x => !x.tool);
  if(h2){ h2.tool = 'memento'; tr(h2.id, 5); if(L) L.push(`${jo(h2.name,'이','가')} ${c.name}의 유품을 간직한다. (${h2.name} 신뢰 +5)`); }
  if(L) L.push(`!${c.name} 사망. ${why||''} 전원 신뢰 -5.`);
  logLine(`${c.name} 사망`);
}
function wBand(){ const d = waterDays(); if(S.water <= 0) return {k:'out', n:'고갈', c:'bad'}; if(d >= 4) return {k:'plenty', n:'여유', c:'good'}; if(d >= 2) return {k:'ok', n:'보통', c:''}; if(d >= 1) return {k:'low', n:'부족', c:'warn'}; return {k:'crit', n:'위기', c:'bad'}; }
function fBand(f){ f = f ?? S.fuel; if(f >= 30) return {n:'충분', c:'good'}; if(f >= 15) return {n:'보통', c:''}; if(f >= 5) return {n:'부족', c:'warn'}; return {n:'고갈', c:'bad'}; }
function tBand(t){ t = t ?? avgTrust(); if(t >= 70) return {n:'결속', c:'good'}; if(t >= 50) return {n:'안정', c:''}; if(t >= 30) return {n:'불신', c:'warn'}; return {n:'분열', c:'bad'}; }
function aBand(a){ if(a < 20) return {n:'고요', p:.05, z:[1,2], c:'good'}; if(a < 40) return {n:'주의', p:.2, z:[3,4], c:''}; if(a < 70) return {n:'위험', p:.45, z:[5,8], c:'warn'}; return {n:'포위', p:1, z:[10,12], c:'bad'}; }
function hpState(c){ if(c.hp >= 70) return '건강'; if(c.hp >= 40) return '부상'; return '중상'; }
function attackP(ap){ let p = aBand(ap).p; if(S.season === 'cold') p += .15; if(S.diff === 'survival') p += .1; if(S.f.crisis) p -= .1; if(S.f.attackStreak >= 2) p -= .2; return clamp(p, 0, 1); }
function pct(p){ return Math.round(p*100) + '%'; }
function logLine(t){ S.log.push({d:S.day, t}); }
function histRow(ev){ return {d:S.day, water:S.water, wd:+waterDays().toFixed(1), fuel:S.fuel, trust:avgTrust(), ap:S.approach, crew:headcount(), ev}; }
function nightAp(){
  let ap = S.approach; const m = wx().mult;
  if(S.anchor) ap = Math.round(ap * (S.season === 'cold' ? .6 : .3));
  else { if(!S.docked) ap += Math.round(10*m); else if(S.nightsHere >= 1) ap += Math.round(10*m); if(S.loc === 6) ap += 15; }
  if(S.lights) ap += Math.round(10*m);
  if(has('baby')) ap += 5;
  return ap;
}
function guardCap(list){
  let cap = 0;
  list.forEach(c => { let b = c.id === 'min' ? (c.lv >= 2 ? 4 : 3) : 2; if(c.hp < 70) b = Math.max(1, Math.floor(b/2)); cap += b; });
  if(S.f.married && list.some(c => S.f.married.includes(c.id))) cap += 1;
  if(bonded()) cap = Math.round(cap * 1.2);
  return cap;
}
function guards(){ return onboard().filter(c => c.role === 'guard' && !c.child && !c.pregnant && !c.quar && c.hp > 0); }
function rollLine(p, r, hit, what){
  const diff = Math.abs(r - p);
  if(!hit && p > 0 && diff < .06) return `~${what} 판정 ${pct(p)} — ${Math.max(1, Math.round(diff*100))}% 차이로 피했다.`;
  if(hit && p < 1 && diff < .06) return `!${what} 판정 ${pct(p)} — ${Math.max(1, Math.round(diff*100))}% 차이로 걸렸다.`;
  return null;
}
/* zombies falling on deck (bridges) */
function cling(L, p, certain){
  if(!(certain || chance(p))) return;
  const n = ri(1,3);
  if(hasTool('hook')){ const h = alive().find(c => c.tool === 'hook'); L.push(`~다리 위에서 좀비 ${n}마리가 떨어졌다. ${jo(h.name,'이','가')} 갈고리 장대로 떼어냈다.`); return; }
  const g = guards(); const cap = guardCap(g);
  const rest = Math.max(0, n - cap);
  if(!rest){ L.push(`~다리 위에서 좀비 ${n}마리가 떨어졌다. 경계조가 모두 밀어냈다.`); return; }
  const fm = S.up.fence ? .7 : 1;
  const hits = [];
  for(let i=0;i<rest;i++){ const v = pick(g.length ? g : onboard().filter(c=>!c.baby)); if(v) hits.push(hurt(v, Math.round(15*fm), .25)); }
  L.push(`!다리 위에서 좀비 ${n}마리가 갑판에 떨어졌다. ${hits.join(', ')}.`);
}

function bestPair(){
  let best = null, bv = 79;
  for(const k in S.rel){ const [a,b] = k.split('|'); if(k === 'nae|woo') continue; const A = byId(a), B = byId(b);
    if(!A || !B || !A.alive || !B.alive || A.left || B.left || A.child || B.child) continue;
    if(S.rel[k] > bv){ bv = S.rel[k]; best = [A,B]; } }
  return best;
}

function pickEvent(){
  const list = Object.entries(EV).filter(([id,e]) => !e.filler && !S.used[id] && e.when()).sort((a,b) => b[1].pri - a[1].pri);
  if(list.length){ list[0][1].when(); return list[0][0]; }
  const fill = Object.entries(EV).filter(([id,e]) => e.filler && S.used[id] !== S.day - 1 && e.when());
  return pick(fill)[0];
}

  S.wx = (WEATHER[S.season] || WEATHER.monsoon)[S.day-1] || 'clear';
  S.anchor = false; S.lights = false; S.boil = 0;
  Object.assign(S.f, {landedToday:false, movedLegs:0, forcedStay:false, theftAgain:false, watched:null});
  S.crew.forEach(c => { c.medToday = false; });
  const pre = [];
  if(S.f.soAway){ const so = byId('so'); S.f.soAway = false; so.away = false; if(chance(.8)) pre.push('+한소율이 자경단 구역에서 돌아왔다.'); else { so.left = true; pre.push('!한소율이 돌아오지 않았다. 자경단은 대답이 없다.'); } }
  const cnt = (waterDays() < 2) + (S.fuel < 15) + (avgTrust() < 50);
  S.f.crisis = DIFFS[S.diff].crisis && cnt >= 2;
  if(S.f.crisis) pre.push('~강이 잠시 조용하다. 위기 보정: 오늘 상륙 보급 +30%, 습격 확률 -10%p.');
  if(bonded()) pre.push('+희망 연쇄: 신뢰 결속. 역할 효율 +20%, 결속 전용 선택지가 열린다.');
  S.pre = pre;
  S.evId = pickEvent();
  if(EV[S.evId].filler) S.used[S.evId] = S.day;
  S.phase = 'morning';
  snaps.push(clone(S)); if(snaps.length > 5) snaps.shift();
  save(); render(true);
}
function chooseEvent(k){
  const ev = EV[S.evId]; const ch = k === '_pass' ? {k:'–', t:'아무것도 할 수 없다', run(){ addTrust(-2); return ['오늘은 그냥 지나갔다.']; }} : ev.choices().find(c => c.k === k);
  if(!ch || (ch.need && ch.need())) return;
  const out = ch.run();
  if(!ev.filler && S.used[S.evId] !== false) S.used[S.evId] = true;
  if(S.used[S.evId] === false) delete S.used[S.evId];
  S.f.lastDeath = false; S.f.lastAttack = false;
  S.evTitle = ev.title; logLine(`『${ev.title}』 — ${ch.t}`);
  alive().forEach(c => { if(c.hp <= 0) kill(c, out, ''); });
  S.lines = out;
  S.phase = S.evId === 'final' ? 'final' : 'evres';
  render(true);
}
function toAssign(){ autoFix(); S.phase = 'assign'; render(); }
function autoFix(){ alive().forEach(c => { if(c.child || c.quar || c.away) { c.role = 'rest'; return; } if(c.role === 'land' && !canLand(c)) c.role = 'rest'; if(c.pregnant && (c.role === 'guard' || c.role === 'land')) c.role = 'rest'; }); }
function setRole(id, role){ const c = byId(id); if(!c || c.child || c.quar || c.away) return; if(role === 'land' && !canLand(c)) return; if(c.pregnant && (role === 'guard' || role === 'land')) return; c.role = role; render(); }
function toRoute(){ S.phase = 'route'; render(); }
function route(kind){
  const L = [];
  if(kind === 'stay'){ L.push(`${LOCS[S.loc].short}에 머문다. 연료를 아끼지만 접근도가 쌓인다.`); }
  else {
    const n = kind === 'two' ? 2 : 1;
    for(let i = 0; i < n && S.loc < 6; i++){ travelLeg(L); }
    S.f.movedLegs = n;
  }
  S.lines = L;
  const canLandHere = LOCS[S.loc].loot && !S.f.landedToday && S.f.movedLegs < 2;
  S.phase = canLandHere ? 'landing' : 'night';
  if(!canLandHere) S.pre = L; else S.routeLines = L;
  render(true);
}
function travelLeg(L){
  const i = S.loc, cost = legCost(i); S.fuel -= cost;
  let line = `${LOCS[i].short} → ${LOCS[i+1].short}: 연료 -${cost}L`;
  if(wx().fog && !engineHas('du') && !S.up.search && chance(.2)){ S.fuel -= 3; line += ' · 안개 속 항로 이탈, 연료 -3L'; }
  if(wx().rain){ let d = 10; if(engineHas('du')) d = byId('du').lv >= 2 ? 0 : 5; if(d){ S.hull -= d; line += ` · 불어난 수위에 다리 충돌, 선체 -${d}`; } }
  if(S.season === 'drought' && (i === 2 || i === 3) && chance(.3)){ S.hull -= 10; S.fuel -= 3; line += ' · 얕은 여울에 좌초, 선체 -10 · 연료 -3L'; }
  if(S.fuel < 0) S.fuel = 0;
  L.push(line);
  cling(L, wx().fog ? .2 : .3);
  S.loc++; S.approach = S.loc === 6 ? 25 : 0; S.docked = false; S.nightsHere = 0;
  if(S.loc === 6 && S.day < 7) L.push('!행주대교 위의 좀비 떼가 새벽호를 내려다본다. 이곳은 기다리기 좋은 곳이 아니다. (접근도 25에서 시작)');
  if(engineHas('tae')) gainXp('tae'); if(engineHas('du')) gainXp('du');
}
function gainXp(id){ const c = byId(id); if(!c) return; c.xp++; const lv = Math.min(3, 1 + Math.floor(c.xp/3)); if(lv > c.lv){ c.lv = lv; S.pre = (S.pre||[]); S.levelUps = (S.levelUps||[]).concat(`${c.name} 숙련도 Lv${lv}`); } }
function lootMult(){
  const ls = landers(), n = ls.length; let m = n === 0 ? 0 : n === 1 ? .6 : n === 2 ? 1 : 1.2;
  if(ls.some(c => c.id === 'ga')) m *= byId('ga').lv >= 2 ? 1.3 : 1.2;
  if(bonded()) m *= 1.2; if(S.f.crisis) m *= 1.3; m *= ERAS[S.era].loot;
  if(S.f.married && ls.filter(c => S.f.married.includes(c.id)).length === 2) m *= 1.2;
  return m;
}
function landPreview(len){
  const loc = LOCS[S.loc]; const m = lootMult() * LEN[len].m; const got = [];
  for(const k in loc.loot){ const v = Math.round(loc.loot[k]*m); if(v > 0) got.push([k, v]); }
  let ap = LEN[len].ap + (loc.zone === 'park' ? 5 : 0) + (!S.docked && !S.up.boat ? 10 : 0);
  return {got, ap:Math.round(ap * wx().mult)};
}
const RES_N = {water:'식수', parts:'부품', meds:'약품', fuel:'연료'};
function land(len){
  const L = (S.routeLines || []).slice(); S.routeLines = null;
  if(len === 'none'){ L.push('오늘은 상륙하지 않는다.'); S.pre = L; S.phase = 'night'; render(true); return; }
  const loc0 = LOCS[S.loc], pv0 = landPreview(len);
  if(ACT.enabled() && landers().length){
    const toolHere = len !== 'short' && loc0.tool && !S.f.tools[loc0.tool + S.loc] && !hasTool(loc0.tool) ? loc0.tool : null;
    ACT.landing({len, pv:pv0, landers:landers(), tool:toolHere}, res => landFinish(len, L, res));
    return;
  }
  landFinish(len, L, null);
}
function landFinish(len, L, res){
  const loc = LOCS[S.loc]; const pv = landPreview(len);
  if(res){ pv.got = Object.entries(res.got).filter(([k, v]) => v > 0); }
  if(!S.docked){ if(S.up.boat) L.push('구명보트로 상륙해 배를 강변에 대지 않았다.'); else S.docked = true; }
  S.approach += pv.ap;
  pv.got.forEach(([k,v]) => { S[k] += v; }); if(S.fuel > 60) S.fuel = 60;
  L.push(`+${LEN[len].n} 상륙: ` + (pv.got.length ? pv.got.map(([k,v]) => `${RES_N[k]} +${v}${k==='fuel'?'L':''}`).join(', ') : '건진 것이 없다') + ` · 접근도 +${pv.ap}`);
  if(res) res.lines.forEach(l => L.push('~' + l));
  if(len !== 'short' && loc.tool && !S.f.tools[loc.tool + S.loc] && !hasTool(loc.tool) && (!res || res.tool)){
    S.f.tools[loc.tool + S.loc] = 1; if(loc.tool === 'radio') S.f.tools.radio = 1;
    const h = giveTool(loc.tool, landers().map(c=>c.id)); if(h) L.push(`+${jo(TOOLS[loc.tool],'을','를')} 찾았다. (${h.name})`);
  }
  if(res){ [res.pl].concat(res.allies).forEach(a => { const d = Math.round((a.hp0 - a.hp)*.8); if(d > 0) L.push('!' + hurt(a.c, d, Math.min(.35, a.hits*.06)) + ' (상륙 중 부상)'); }); if(res.late){ S.approach += 10; L.push('!늦게 돌아온 탓에 좀비가 따라왔다. 접근도 +10'); } }
  else if(len === 'long' && chance(.35)){ const v = pick(landers()); if(v) L.push('!' + hurt(v, 15, .15) + ' (상륙 중 부상).'); }
  if(landers().some(c => c.id === 'ga')) gainXp('ga');
  S.f.landedToday = true; S.pre = L; S.phase = 'night'; render(true);
}
function build(id){
  const u = UPG.find(x => x.id === id); if(!u || S.parts < u.cost) return;
  if(!u.repeat && S.up[id]) return;
  S.parts -= u.cost;
  if(id === 'repair') S.hull = clamp(S.hull + 15, 0, 100); else S.up[id] = true;
  flash('parts'); render();
}
function useMed(id){
  const c = byId(id); if(!c || S.meds < 1 || !c.alive) return;
  S.meds--; c.hp = clamp(c.hp + 25 + (has('so') ? 10 : 0), 0, 100); c.sick = false; c.medToday = true;
  if(has('so')) gainXp('so');
  openCrew();
  render();
}
function settle(){
  const L = (S.pre || []).filter(x => typeof x === 'string' && !x.startsWith('~강이') && !x.startsWith('+희망'));
  const R = [];
  const m = wx().mult;
  if(S.season === 'cold'){ S.fuel = Math.max(0, S.fuel - 2); R.push('난방에 연료 2L를 썼다.'); }
  if(S.anchor && S.fuel >= 2){
    S.fuel -= 2; S.approach = Math.round(S.approach * (S.season === 'cold' ? .6 : .3)); S.docked = false;
    R.push(`강 한가운데 닻을 내렸다. 연료 -2L, 접근도 → ${S.approach}`);
  } else {
    if(!S.docked){ S.approach += Math.round(10*m); S.docked = true; }
    else if(S.nightsHere >= 1){ S.approach += Math.round(10*m); R.push('같은 자리에서 또 밤을 보낸다. 냄새가 퍼졌다.'); }
    if(S.loc === 6){ S.approach += 15; R.push('!다리 위 좀비 떼가 계류줄 쪽으로 몰려든다. 접근도 +15'); }
    S.nightsHere++;
  }
  if(S.lights){ S.approach += Math.round(10*m); addTrust(2); R.push('+갑판 조명을 켰다. 다들 얼굴이 밝아졌다. (신뢰 +2)'); }
  if(has('baby')) S.approach += 5;
  if(S.fuel <= 4 && !S.anchor){
    S.approach += 40; R.push('!연료 고갈 — 배가 물살에 떠밀려 강변에 좌초했다. 접근도 +40.');
    if(S.loc < 6 && chance(.5)){ S.loc++; S.nightsHere = 0; R.push(`~떠밀린 덕분에 ${LOCS[S.loc].short} 근처까지 내려왔다.`); }
  }
  if(S.boil > 0){
    if(S.loc === 6){ R.push('!염분 구간이라 강물을 끓여도 마실 수 없다.'); }
    else { const n = Math.min(S.boil, S.fuel); S.fuel -= n; S.water += n*4; R.push(`+강물을 끓였다. 연료 -${n}L → 식수 +${n*4}`); }
  }
  if(wx().rain){ const v = S.up.rain ? 12 : 6; S.water += v; R.push(`+빗물을 받았다. 식수 +${v}`); }
  if(S.up.filter && S.loc !== 6){ S.water += 6; R.push('+정수 필터. 식수 +6'); }
  // attack
  const ap = S.approach, band = aBand(ap), p = attackP(ap), r = rnd(), hit = r < p;
  const rl = rollLine(p, r, hit, '습격');
  R.push(`오늘 밤 접근도 ${ap} (${band.n}) · 습격 확률 ${pct(p)}`);
  if(rl) R.push(rl);
  if(hit){
    S.f.attackStreak++; S.f.lastAttack = true;
    let z = Math.max(1, Math.round(ri(band.z[0], band.z[1]) * ERAS[S.era].z));
    let g = guards();
    const refused = g.filter(c => c.trust < 50 && chance(.2));
    if(refused.length){ g = g.filter(c => !refused.includes(c)); R.push('!' + refused.slice(0, -1).map(c => c.name + ', ').join('') + `${jo(refused[refused.length-1].name,'이','가')} 경계를 거부했다. (불신)`); }
    if(S.f.watched){ const w = byId(S.f.watched); if(w) g = g.filter(c => c.id !== w.id); }
    let cap = guardCap(g);
    if(S.loc === 4 && !S.anchor){ cap += 2; }
    if(ACT.enabled()){ R.push('!습격 — 좀비 떼가 계류줄과 선체를 타고 올라온다.'); ACT.raid({z, guards:g, cap}, res => { raidApply(res, R, g); settleRest(L, R); }); return; }
    cap += armsBonus(true);
    const rest = Math.max(0, z - cap);
    R.push(`!습격 — 좀비 ${z}마리가 계류줄을 타고 올라온다. 방어 ${cap}${S.loc===4&&!S.anchor?' (자경단 지원 +2 포함)':''}.`);
    if(!rest && cap - z <= 1) R.push(`~${cap - z === 0 ? '마지막 한 마리까지' : '1마리 차이로'} 막아냈다. 피해 없음.`);
    else if(!rest) R.push('+모두 막아냈다. 피해 없음.');
    else {
      const fm = S.up.fence ? .7 : 1; const hits = [];
      for(let i = 0; i < rest; i++){
        if(g.length && chance(.5)){ hits.push(hurt(pick(g), Math.round(15*fm), .25)); }
        else if(g.length){ const d = Math.round(8*fm); S.hull -= d; hits.push(`선체 -${d}`); }
        else { const v = pick(onboard().filter(c => !c.baby)); if(v) hits.push(hurt(v, Math.round(15*fm), .25)); }
      }
      R.push('!' + hits.join(', ') + '.');
    }
    if(byId('min') && g.includes(byId('min'))) gainXp('min');
  } else { S.f.attackStreak = 0; if(!rl) R.push('+습격 없음.'); }
  settleRest(L, R);
}
function raidApply(res, R, g){
  res.lines.forEach(l => R.push('~' + l));
  const fm = S.up.fence ? .7 : 1;
  [res.pl].concat(res.allies).forEach(a => { const d = Math.round((a.hp0 - a.hp)*.8); if(d > 0) R.push('!' + hurt(a.c, d, Math.min(.4, a.hits*.07)) + ' (싸우다 다쳤다)'); });
  if(res.breach === 0) R.push('+배 안으로는 한 마리도 들이지 않았다.');
  else { const hits = []; for(let i = 0; i < res.breach; i++){ if(chance(.5)){ const v = pick(onboard().filter(c => !c.baby)); if(v) hits.push(hurt(v, Math.round(12*fm), .2)); } else { const d = Math.round(8*fm); S.hull -= d; hits.push(`선체 -${d}`); } } R.push('!침입 — ' + hits.join(', ') + '.'); }
  if(res.kills >= 8 && !res.skipped){ addTrust(2); R.push('+함께 버텨냈다. 전원 신뢰 +2'); }
  if(g.some(c => c.id === 'min')) gainXp('min');
}
function settleRest(L, R){
  // infection progression
  alive().forEach(c => {
    if(c.bitten === null) return;
    if(c.quar){
      const p2 = partnerOf(c);
      R.push(`!새벽, 격리된 곳에서 비명이 들렸다. ${jo(c.name,'이','가')} 변이했다.`);
      if(p2 && S.up.boat){ R.push(`!${jo(p2.name,'이','가')} 직접 밧줄을 끊었다. 구명보트를 잃었다.`); S.up.boat = false; }
      kill(c, R, '');
    } else if(c.watch){

      else { c.bitten++; R.push(`~${jo(c.name,'은','는')} 아직 버티고 있다.`); }
    } else {
      c.bitten++;
      if(c.bitten >= 3){ R.push(`!잠든 사이 ${jo(c.name,'이','가')} 변이했다. 아무도 몰랐다.`); const v = pick(onboard().filter(x => x.id !== c.id && !x.baby)); kill(c, R, ''); if(v) R.push('!' + hurt(v, 20, .3) + '.'); }
    }
  });
  if(S.f.theftAgain && chance(.5)){ S.water = Math.max(0, S.water - 3); R.push('!밤사이 또 물이 줄었다. 식수 -3'); }
  // consumption
  const cons = consumption(); S.water = Math.max(0, S.water - cons);
  R.push(`식수 소비 -${cons}${S.rationing ? ' (배급제)' : ''} → ${S.water} (${waterDays().toFixed(1)}일분)`);
  S.food -= headcount(); if(engineHas('du') === false && has('du') && byId('du').tool === 'rod' && byId('du').role === 'rest') S.food += 2;
  if(S.food <= 0){ S.food = 0; addTrust(-5); alive().forEach(c => c.hp = clamp(c.hp - 5, 0, 100)); R.push('!비상식량이 바닥났다. 전원 체력 -5, 신뢰 -5.'); }
  // health
  const wb = wBand();

  alive().forEach(c => {
    if(c.role === 'rest' && !c.quar && !c.away) c.hp = clamp(c.hp + Math.round((10 + (has('yu') ? 5 : 0)) * healMul), 0, 100);
    if(c.hp < 40 && !c.medToday) c.hp = clamp(c.hp - 5, 0, 100);

  });
  addTrust(-1); R.push('지친 밤이 지나간다. 전원 신뢰 -1');
  if(wb.k === 'plenty'){ addTrust(1); R.push('+식수 여유. 전원 신뢰 +1'); }
  if(wb.k === 'crit'){ addTrust(-3); alive().forEach(c => c.hp = clamp(c.hp - 5, 0, 100)); R.push('!식수 위기. 전원 체력 -5, 신뢰 -3'); }
  if(wb.k === 'out'){ addTrust(-10); alive().forEach(c => c.hp = clamp(c.hp - 15, 0, 100)); R.push('!식수 고갈. 전원 체력 -15, 신뢰 -10'); }
  // desertion
  alive().forEach(c => {
    if(c.child || c.quar || c.away || c.trust >= 30 || S.f.watched === c.id) return;

  });
  // deaths

  ['land','guard','engine','water'].forEach(role => { const g = onboard().filter(c => c.role === role && !c.child); for(let i = 0; i < g.length; i++) for(let j = i+1; j < g.length; j++) addRel(g[i].id, g[j].id, 10); });
  if(S.levelUps && S.levelUps.length){ R.push('+숙련도 상승: ' + S.levelUps.join(', ')); S.levelUps = []; }
  if(S.fuel > 60){ S.fuel = 60; R.push('연료 탱크가 가득 찼다 (최대 60L).'); }
  S.lines = L.concat(R);
  S.hist.push(histRow(S.evTitle));

  if(S.hull <= 0){ if(!S.f.lastChance){ S.phase = 'result'; render(true); lastChance('hull'); return; } return endGame('sink'); }
  if(onboard().filter(c => !c.baby).length === 0){ return endGame('sink'); }
  S.phase = 'result'; save(); render(true);
}
function leaveShip(c){ c.left = true; c.tool = null; S.water = Math.max(0, S.water - 3); const p = partnerOf(c); if(p && rel(c.id,p.id) >= 60 && !p.child){ p.left = true; } logLine(`${c.name} 이탈`); }
function nextDay(){ S.day++; startDay(); }
function resolveFinal(){
  const f = S.f.final || {onTime:false};
  if(f.onTime) return endGame('ok');
  if(!S.f.lastChance) return lastChance('fleet');
  return endGame('drift');
}
function lcOdds(hero){ const t = hero ? hero.trust/100 : .5; return S.diff === 'story' ? .95 : S.diff === 'survival' ? clamp(t - .2, .25, .6) : clamp(t - .05, .35, .85); }
function lastChance(kind){
  S.f.lastChance = true;
  const hero = lowestTrust() ? alive().filter(c => !c.child).sort((a,b) => b.trust - a.trust)[0] : null;
  const m = $('#modal');

function drawChart(c, hist){
  if(!c) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1), cw = Math.max(240, c.clientWidth || 360), ch = Math.round(cw/3);
  c.width = Math.round(cw*dpr); c.height = Math.round(ch*dpr);
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#121019'; x.fillRect(0, 0, cw, ch);
  const L = 30, R = 12, T = 10, B = 22, w = cw - L - R, h = ch - T - B;
  x.font = `11px 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif`; x.textBaseline = 'middle';
  [0,25,50,75,100].forEach(v => { const y = Math.round(T + h*(1 - v/100)) + .5; x.strokeStyle = v ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.2)'; x.lineWidth = 1; x.beginPath(); x.moveTo(L, y); x.lineTo(L + w, y); x.stroke(); x.fillStyle = '#8f879e'; x.textAlign = 'right'; x.fillText(v, L - 6, y); });
  if(!hist.length) return;
  const n = hist.length, X = i => L + (n === 1 ? w/2 : i*w/(n - 1)), Y = v => T + h*(1 - clamp(v, 0, 100)/100);
  const step = Math.ceil(n / Math.max(2, Math.floor(w/38)));
  x.fillStyle = '#a79fb8'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  hist.forEach((r, i) => { if(i % step === 0 || i === n - 1) x.fillText(r.d ? 'D' + r.d : '출발', X(i), ch - 6); });
  const line = (key, col, mul) => {
    x.strokeStyle = col; x.lineWidth = 2.2; x.lineJoin = 'round'; x.lineCap = 'round'; x.beginPath();
    hist.forEach((r, i) => { const px = X(i), py = Y(r[key]*mul); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke();
    hist.forEach((r, i) => { x.beginPath(); x.arc(X(i), Y(r[key]*mul), 3, 0, Math.PI*2); x.fillStyle = '#121019'; x.fill(); x.lineWidth = 1.8; x.stroke(); });
  };
  line('fuel', '#8fd8a2', 1); line('wd', '#8dbdf2', 10); line('trust', '#f2a65a', 1);
}
